<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-labelledby="purjeet-t purjeet-d">
  <title id="purjeet-t">Pesosenpuoti – Purjeet PP</title>
  <desc id="purjeet-d">Kaksi purjetta muodostavat PP-kirjainmerkin.</desc>
  <!-- Left sail: Baltic blue, leans left from mast -->
  <path d="M82 14 L36 98 L82 98 Z" fill="#2768b0"/>
  <!-- Right sail: gold, leans right from mast -->
  <path d="M82 14 L82 98 L128 98 Z" fill="#ca9810"/>
  <!-- Mast -->
  <line x1="82" y1="10" x2="82" y2="100" stroke="#1b3c6a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Hull (gentle curve) -->
  <path d="M28 104 Q82 116 136 104" fill="none" stroke="#1b3c6a" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="162" y="58" fill="#1b3c6a" font-family="'Barlow', Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">Pesosen</text>
  <text x="162" y="86" fill="#2768b0" font-family="'Barlow', Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="5">PUOTI</text>
</svg>
