<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-labelledby="telakka-t telakka-d">
  <title id="telakka-t">Pesosenpuoti – Telakka PP</title>
  <desc id="telakka-d">PP-kirjainmerkki telakkarakenteen yllä.</desc>
  <g id="letter-P1">
    <text x="10" y="76" font-family="'Barlow', 'Arial Black', Arial, sans-serif" font-size="62" font-weight="900" fill="#1b3c6a">P</text>
  </g>
  <g id="letter-P2">
    <text x="48" y="76" font-family="'Barlow', 'Arial Black', Arial, sans-serif" font-size="62" font-weight="900" fill="#2768b0">P</text>
  </g>
  <g id="hull">
    <path d="M8 82 H90 L80 98 H18 Z" fill="#ca9810"/>
  </g>
  <g id="dock-support-left">
    <line x1="30" y1="98" x2="30" y2="110" stroke="#1b3c6a" stroke-width="4" stroke-linecap="round"/>
