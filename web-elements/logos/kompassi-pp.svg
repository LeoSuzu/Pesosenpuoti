<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-labelledby="kompassi-t kompassi-d">
  <title id="kompassi-t">Pesosenpuoti – Kompassi PP</title>
  <desc id="kompassi-d">PP-kirjaimet kompassiruusussa aallon päällä.</desc>
  <g id="compass-ring">
    <circle cx="60" cy="57" r="50" fill="#eef3f8" stroke="#1b3c6a" stroke-width="3"/>
  </g>
  <g id="needle-north">
    <path d="M60 13 L65 52 L60 58 L55 52 Z" fill="#2768b0"/>
  </g>
  <g id="needle-south">
    <path d="M60 101 L65 62 L60 56 L55 62 Z" fill="#1b3c6a" opacity="0.25"/>
  </g>
  <g id="needle-east">
    <path d="M106 57 L67 62 L61 57 L67 52 Z" fill="#1b3c6a" opacity="0.25"/>
  </g>
  <g id="needle-west">
    <path d="M14 57 L53 62 L59 57 L53 52 Z" fill="#1b3c6a" opacity="0.25"/>
  </g>
  <g id="compass-pp-text">
    <text x="60" y="65" text-anchor="middle" font-family="'Barlow', 'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" fill="#1b3c6a" letter-spacing="3">PP</text>
  </g>
  <g id="wave">
    <path d="M16 114 Q28 108 40 114 Q52 120 64 114 Q76 108 88 114 Q100 120 104 114" fill="none" stroke="#2768b0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="wordmark-pesosen">
    <text x="130" y="56" fill="#1b3c6a" font-family="'Barlow', Arial, sans-serif" font-size="27" font-weight="700">Pesosen</text>
  </g>
  <g id="wordmark-puoti">
    <text x="130" y="82" fill="#2768b0" font-family="'Barlow', Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="4">PUOTI</text>
  </g>
</svg>
